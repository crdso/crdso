name: Generate contribution snake

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'
  schedule:
    - cron: '15 5 * * *'  # every day, UTC

permissions:
  contents: write

jobs:
  snake:
    name: Render snake and update output branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: crdso
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%2300BAA5
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2325E0A2

      - name: Publish generated SVG files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore: update contribution snake [skip ci]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
